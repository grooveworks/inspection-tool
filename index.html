function updateRowUI(dimId){
  const dim=P.dims.find(d=>d.id===dimId);if(!dim)return;
  const lv=latest(dimId);const j=judge(lv,dim.nominal,dim.upper,dim.lower);
  // Update deviation texts
  for(let ri=0;ri<ROUNDS;ri++){
    const devEl=document.getElementById(`dev-${dimId}-${ri}`);

      if(v!==""){const mid=midLim(dim);const dv=r4(parseFloat(v)-mid);const rj=judge(v,dim.nominal,dim.upper,dim.lower);devEl.textContent="("+(dv>0?"+":"")+dv+")";devEl.style.color=rj==="OK"?"#16a34a":"#dc2626";devEl.style.display="";}
      else{devEl.textContent="";devEl.style.display="none";}
    }
    // Update input border
    const inp=document.querySelector(`[data-dim="${dimId}"][data-ri="${ri}"]`);
    if(inp){const rj=judge(v,dim.nominal,dim.upper,dim.lower);inp.style.borderColor=rj==="NG"?"#fca5a5":"#d1d5db";inp.style.background=rj==="NG"?"#fff5f5":"#f8fafc";}

  if(barEl){barEl.innerHTML="";barEl.appendChild(devBar(lv,dim.nominal,dim.upper,dim.lower));}
  // Update judge
  const jEl=document.getElementById(`judge-${dimId}`);
  if(jEl){jEl.innerHTML="";if(j)jEl.appendChild(h("div",{style:{display:"inline-block",padding:"2px 8px",borderRadius:"4px",fontWeight:"800",fontSize:"12px",color:"#fff",background:j==="OK"?"#16a34a":"#dc2626"}},j));}
  // Update row bg
  const row=document.getElementById(`row-${dimId}`);
  if(row)row.style.background=j==="NG"?"#fef2f2":"transparent";
  // Update summary
  updateSummary();
}
function updateSummary(){
  const st=P.dims.reduce((a,d)=>{const j=judge(latest(d.id),d.nominal,d.upper,d.lower);if(j==="OK")a.ok++;else if(j==="NG")a.ng++;else a.none++;return a;},{ok:0,ng:0,none:0});
  const ids=["sum-total","sum-ok","sum-ng","sum-none"];
  const vals=[P.dims.length,st.ok,st.ng,st.none];
  ids.forEach((id,i)=>{const el=document.getElementById(id);if(el)el.textContent=vals[i];});
  // Update tab badge
  const fc=P.dims.filter(d=>d.inReport!==false&&latest(d.id)!=="").length;
  const tb=document.getElementById("tab-report");
  if(tb)tb.textContent="📄 ② 検査成績書"+(fc>0?` (${fc}件)`:"");
}

    loInp.addEventListener("focus",e=>e.target.select());
    row.appendChild(h("td",{style:{padding:"4px 2px"}},loInp));
    // Tool name
    const toolInp=h("input",{type:"text",value:d.toolName||"",placeholder:"—",style:{...inpS,fontFamily:"inherit",fontSize:"11px",textAlign:"left"}});
    toolInp.addEventListener("change",e=>{d.toolName=e.target.value.trim();schedSave();});
    row.appendChild(h("td",{style:{padding:"4px 2px"}},toolInp));
    // Job No.
    const jobInp=h("input",{type:"text",value:d.jobNo||"",placeholder:"—",style:{...inpS,fontSize:"11px"}});
    jobInp.addEventListener("change",e=>{d.jobNo=e.target.value.trim();schedSave();});
    row.appendChild(h("td",{style:{padding:"4px 2px"}},jobInp));
    // Delete
    row.appendChild(h("td",{style:{padding:"4px 2px",textAlign:"center"}},h("button",{style:{padding:"2px 6px",borderRadius:"4px",border:"1px solid #fca5a5",background:"#fff",fontSize:"11px",color:"#dc2626",cursor:"pointer",lineHeight:"1"},onClick:()=>{if(!confirm((idx+1)+". "+dName(d)+" を削除？"))return;P.dims=P.dims.filter(x=>x.id!==d.id);delete P.meas[d.id];schedSave();render();}},"×")));
    stbd.appendChild(row);
  });
  stbl.appendChild(stbd);
  ed.appendChild(h("div",{style:{overflowX:"auto"}},stbl));
  // Add new row
  ed.appendChild(h("button",{style:{width:"100%",padding:"8px",borderRadius:"6px",border:"2px dashed #d1d5db",background:"transparent",fontSize:"13px",fontWeight:"600",color:"#64748b",marginTop:"8px"},onClick:()=>{
    const nid=Math.max(0,...P.dims.map(d=>d.id))+1;
    P.dims.push({id:nid,name:"φ0",tClass:"",nominal:0,upper:0,lower:0,type:"穴",inReport:true,toolName:"",jobNo:""});
    P.meas[nid]=Array(ROUNDS).fill("");schedSave();render();
  }},"＋ 寸法を追加"));
  app.appendChild(ed);}

  // Info row
  const info=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",marginBottom:"10px"}});
  [{l:"加工日",k:"date",t:"date"},{l:"作業者",k:"inspector",t:"text",p:"氏名"},{l:"S/N",k:"serial",t:"text",p:"シリアルNo."}].forEach(f=>{
    const inp=h("input",{type:f.t,value:P[f.k]||"",placeholder:f.p||"",style:{width:"100%",border:"none",borderBottom:"2px solid #e2e8f0",fontSize:"14px",padding:"2px 0",outline:"none",background:"transparent",fontFamily:"inherit",color:"#334155",boxSizing:"border-box"}});
    // NO render on input - just save
    inp.addEventListener("input",e=>{P[f.k]=e.target.value;schedSave();});
    info.appendChild(h("div",{style:{background:"#fff",borderRadius:"8px",padding:"8px 10px",boxShadow:"0 1px 2px rgba(0,0,0,.05)"}},h("div",{style:{fontSize:"10px",color:"#94a3b8",fontWeight:"600",marginBottom:"2px"}},f.l),inp));
  });app.appendChild(info);

  // Summary
  const st=P.dims.reduce((a,d)=>{const j=judge(latest(d.id),d.nominal,d.upper,d.lower);if(j==="OK")a.ok++;else if(j==="NG")a.ng++;else a.none++;return a;},{ok:0,ng:0,none:0});
  const sm=h("div",{style:{display:"flex",gap:"6px",marginBottom:"10px"}});
  [{l:"全項目",c:P.dims.length,id:"sum-total",bg:"#e2e8f0",fg:"#334155"},{l:"OK",c:st.ok,id:"sum-ok",bg:"#dcfce7",fg:"#16a34a"},{l:"NG",c:st.ng,id:"sum-ng",bg:"#fee2e2",fg:"#dc2626"},{l:"未測定",c:st.none,id:"sum-none",bg:"#f1f5f9",fg:"#94a3b8"}].forEach(i=>{
    sm.appendChild(h("div",{style:{flex:"1",background:i.bg,borderRadius:"8px",padding:"6px 8px",textAlign:"center"}},h("span",{style:{fontSize:"10px",color:i.fg,fontWeight:"600"}},i.l),h("span",{id:i.id,style:{fontSize:"16px",fontWeight:"800",color:i.fg,marginLeft:"4px"}},""+i.c)));
  });app.appendChild(sm);

  // Measurement table
  const tw=h("div",{style:{background:"#fff",borderRadius:"10px",boxShadow:"0 1px 4px rgba(0,0,0,.08)",overflow:"auto"}});
  const tbl=h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:"13px",minWidth:"780px"}});
  const thr=h("tr",{style:{background:"#334155",color:"#fff",fontSize:"11px",fontWeight:"600"}});
  [{t:"📄",a:"center",w:"32px"},{t:"種別",a:"center",w:"52px"},{t:"寸法",a:"left",w:"80px"},{t:"公差",a:"center",w:"70px"},{t:"上限 / 下限",a:"center",w:"80px"},{t:"中間値",a:"center",w:"70px"}].forEach(c=>thr.appendChild(h("th",{style:{padding:"7px 4px",textAlign:c.a,width:c.w}},c.t)));
  for(let i=0;i<ROUNDS;i++)thr.appendChild(h("th",{style:{padding:"7px 3px",textAlign:"center",minWidth:"85px"}},(i+1)+"回目"));
  thr.appendChild(h("th",{style:{padding:"7px 4px",textAlign:"center",width:"100px"}},"状態"));
  thr.appendChild(h("th",{style:{padding:"7px 4px",textAlign:"center",width:"44px"}},"判定"));
  tbl.appendChild(h("thead",{},thr));
  const tbd=h("tbody",{});

  P.dims.forEach(dim=>{
    const arr=P.meas[dim.id]||Array(ROUNDS).fill("");
    const lv=latest(dim.id);const j=judge(lv,dim.nominal,dim.upper,dim.lower);
    const tr=h("tr",{id:`row-${dim.id}`,style:{borderBottom:"1px solid #f1f5f9",background:j==="NG"?"#fef2f2":"transparent"}});
    // Report checkbox
    if(dim.inReport===undefined)dim.inReport=true;
    const chk=h("input",{type:"checkbox",style:{cursor:"pointer",width:"16px",height:"16px"}});
    chk.checked=dim.inReport;
    chk.addEventListener("change",e=>{dim.inReport=e.target.checked;schedSave();});
    tr.appendChild(h("td",{style:{padding:"4px 2px",textAlign:"center"}},chk));
    // Type dropdown
    const typeSel=h("select",{style:{fontSize:"11px",padding:"2px 4px",border:"1px solid #d1d5db",borderRadius:"4px",fontFamily:"inherit",background:"#f8fafc",color:"#334155",cursor:"pointer"}});
    const typeColors={"穴":"#2563eb","軸":"#dc2626","距離":"#64748b"};
    ["穴","軸","距離"].forEach(t=>{const o=h("option",{value:t},t);if(dim.type===t)o.selected=true;typeSel.appendChild(o);});
    if(!dim.type)dim.type="穴";
    typeSel.value=dim.type||"穴";
    typeSel.style.color=typeColors[typeSel.value]||"#334155";
    typeSel.style.fontWeight="700";
    typeSel.addEventListener("change",e=>{dim.type=e.target.value;typeSel.style.color=typeColors[e.target.value]||"#334155";schedSave();});
    tr.appendChild(h("td",{style:{padding:"4px 2px",textAlign:"center"}},typeSel));
    const ntd=h("td",{style:{padding:"7px 6px"}},h("span",{style:{fontWeight:"800",fontSize:"14px"}},dim.name));
    if(dim.tClass)ntd.appendChild(h("span",{style:{fontSize:"9px",fontWeight:"700",background:"#dbeafe",color:"#1d4ed8",padding:"1px 4px",borderRadius:"3px",marginLeft:"4px",display:"inline-block"}},dim.tClass));
    const tjParts=[];if(dim.toolName)tjParts.push("T: "+dim.toolName);if(dim.jobNo)tjParts.push("J: "+dim.jobNo);
    if(tjParts.length)ntd.appendChild(h("div",{style:{fontSize:"10px",color:"#94a3b8",marginTop:"2px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},tjParts.join(" / ")));
    tr.appendChild(ntd);
    tr.appendChild(h("td",{style:{padding:"4px 4px",textAlign:"center",fontFamily:"monospace",fontSize:"11px",lineHeight:"1.6"}},
      h("div",{style:{color:"#16a34a",fontWeight:"600"}},fmtTol(dim.upper)),
      h("div",{style:{color:"#dc2626",fontWeight:"600"}},fmtTol(dim.lower))
    ));
    tr.appendChild(h("td",{style:{padding:"4px 4px",textAlign:"center",fontFamily:"monospace",fontSize:"11px",fontWeight:"700",lineHeight:"1.6"}},
      h("div",{style:{color:"#334155"}},""+uLim(dim)),
      h("div",{style:{color:"#94a3b8"}},""+lLim(dim))
    ));
    tr.appendChild(h("td",{style:{padding:"7px 4px",textAlign:"center",fontFamily:"monospace",fontSize:"13px",fontWeight:"800",color:"#2563eb",background:"#eff6ff"}},""+midLim(dim)));

    for(let ri=0;ri<ROUNDS;ri++){
      const td=h("td",{style:{padding:"3px 2px",textAlign:"center"}});
      const v=arr[ri]||"";
      const rj=judge(v,dim.nominal,dim.upper,dim.lower);
      const inp=h("input",{type:"number",step:"0.001",value:v,placeholder:"—",style:{width:"100%",padding:"6px 3px",fontSize:"14px",fontWeight:"700",fontFamily:"'SF Mono','Consolas',monospace",textAlign:"center",border:`2px solid ${rj==="NG"?"#fca5a5":"#d1d5db"}`,borderRadius:"5px",outline:"none",background:rj==="NG"?"#fff5f5":"#f8fafc",boxSizing:"border-box",color:"#1e293b"}});
      inp.setAttribute("data-dim",dim.id);inp.setAttribute("data-ri",ri);

      // KEY FIX: Don't call render() on input - just update state and partial UI
      inp.addEventListener("input",e=>{
        if(!P.meas[dim.id])P.meas[dim.id]=Array(ROUNDS).fill("");
        P.meas[dim.id][ri]=e.target.value;
        schedSave();
        updateRowUI(dim.id);
      });
      inp.addEventListener("focus",e=>{e.target.style.borderColor="#3b82f6";e.target.select();});
      inp.addEventListener("keydown",e=>{
        if(e.key==="Enter"){e.preventDefault();
          const nx=document.querySelector(`[data-dim="${dim.id}"][data-ri="${ri+1}"]`);
          if(nx)nx.focus();
          else{const ids=P.dims.map(d=>d.id);const idx=ids.indexOf(dim.id);if(idx<ids.length-1){const nxt=document.querySelector(`[data-dim="${ids[idx+1]}"][data-ri="0"]`);if(nxt)nxt.focus();}}
        }
      });
      td.appendChild(inp);

      // Deviation display
      const devDiv=h("div",{id:`dev-${dim.id}-${ri}`,style:{fontSize:"9px",marginTop:"1px",fontFamily:"monospace",display:v?"":"none"}});
      if(v!==""){const mid=midLim(dim);const dv=r4(parseFloat(v)-mid);devDiv.textContent="("+(dv>0?"+":"")+dv+")";devDiv.style.color=rj==="OK"?"#16a34a":"#dc2626";}
      td.appendChild(devDiv);
      tr.appendChild(td);
    }

    // Bar & judge with IDs for partial update
    const barTd=h("td",{id:`bar-${dim.id}`,style:{padding:"3px 5px"}});barTd.appendChild(devBar(lv,dim.nominal,dim.upper,dim.lower));tr.appendChild(barTd);
    const jt=h("td",{id:`judge-${dim.id}`,style:{padding:"7px 3px",textAlign:"center"}});if(j)jt.appendChild(h("div",{style:{display:"inline-block",padding:"2px 8px",borderRadius:"4px",fontWeight:"800",fontSize:"12px",color:"#fff",background:j==="OK"?"#16a34a":"#dc2626"}},j));tr.appendChild(jt);
    tbd.appendChild(tr);
  });
  tbl.appendChild(tbd);tw.appendChild(tbl);app.appendChild(tw);
  app.appendChild(h("div",{style:{display:"flex",justifyContent:"flex-end",marginTop:"10px"}},h("button",{style:{padding:"7px 18px",borderRadius:"7px",border:"2px solid #e2e8f0",background:"#fff",fontSize:"12px",fontWeight:"600",color:"#64748b"},onClick:()=>{P.dims.forEach(d=>{P.meas[d.id]=Array(ROUNDS).fill("");});P.serial="";schedSave();render();}},"測定値クリア")));
}

function renderReport(app){
  app.appendChild(h("div",{className:"no-print",style:{display:"flex",justifyContent:"flex-end",marginBottom:"10px"}},h("button",{style:{padding:"8px 24px",borderRadius:"8px",border:"none",background:"#334155",color:"#fff",fontSize:"13px",fontWeight:"700"},onClick:()=>window.print()},"印刷 / PDF保存")));
  const rp=h("div",{className:"print-area",style:{background:"#fff",borderRadius:"10px",padding:"24px",boxShadow:"0 1px 4px rgba(0,0,0,.08)"}});
  rp.appendChild(h("div",{style:{fontSize:"20px",fontWeight:"800",marginBottom:"6px",color:"#1e293b"}},"検査成績書"));
  rp.appendChild(h("div",{style:{fontSize:"12px",color:"#475569",marginBottom:"4px"}},"図番: "+(P.drawingNo||"—")+"　　品名: "+(P.partName||"—")));
  rp.appendChild(h("div",{style:{fontSize:"12px",color:"#475569",marginBottom:"16px"}},"検査日: "+(P.date||"")+"　　担当: "+(P.inspector||"")+(P.serial?"　　S/N: "+P.serial:"")));
  const tbl=h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:"13px"}});
  const thr=h("tr",{style:{background:"#334155",color:"#fff",fontSize:"11px"}});
  [{t:"No.",w:"36px"},{t:"種別",w:"40px"},{t:"寸法"},{t:"上限値"},{t:"下限値"},{t:"実測値"},{t:"判定",w:"50px"}].forEach(c=>thr.appendChild(h("th",{style:{padding:"8px 6px",textAlign:c.t==="寸法"?"left":"center",width:c.w||"auto"}},c.t)));
  tbl.appendChild(h("thead",{},thr));const tbd=h("tbody",{});
  const reportDims=P.dims.filter(d=>d.inReport!==false);
  reportDims.forEach((dim,idx)=>{const lv=latest(dim.id);const j=judge(lv,dim.nominal,dim.upper,dim.lower);
    const r=h("tr",{style:{borderBottom:"1px solid #e2e8f0",background:j==="NG"?"#fef2f2":"transparent"}});
    r.appendChild(h("td",{style:{padding:"9px 6px",textAlign:"center",color:"#94a3b8"}},""+(idx+1)));
    const typeColors2={"穴":"#2563eb","軸":"#dc2626","距離":"#64748b"};
    r.appendChild(h("td",{style:{padding:"9px 4px",textAlign:"center",fontSize:"11px",fontWeight:"700",color:typeColors2[dim.type]||"#94a3b8"}},dim.type||"—"));
    r.appendChild(h("td",{style:{padding:"9px 6px",fontWeight:"700",fontSize:"14px"}},dName(dim)));
    r.appendChild(h("td",{style:{padding:"9px 6px",textAlign:"center",fontFamily:"monospace"}},""+uLim(dim)));
    r.appendChild(h("td",{style:{padding:"9px 6px",textAlign:"center",fontFamily:"monospace"}},""+lLim(dim)));
    r.appendChild(h("td",{style:{padding:"9px 6px",textAlign:"center",fontFamily:"monospace",fontWeight:"700",fontSize:"14px",color:lv?(j==="OK"?"#16a34a":"#dc2626"):"#cbd5e1"}},lv||"—"));
    const jt=h("td",{style:{padding:"9px 6px",textAlign:"center"}});if(j)jt.appendChild(h("span",{style:{fontWeight:"800",color:j==="OK"?"#16a34a":"#dc2626"}},j));else jt.textContent="—";r.appendChild(jt);tbd.appendChild(r);});
  tbl.appendChild(tbd);rp.appendChild(tbl);app.appendChild(rp);
}

function render(){const app=document.getElementById("app");app.innerHTML="";if(view==="list")renderList(app);else renderProject(app);}
showList();
</script>
</body>
</html>
