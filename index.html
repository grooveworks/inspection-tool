const r4 = v => Math.round(v*10000)/10000;
const uLim = d => r4(d.nominal + d.upper);
const lLim = d => r4(d.nominal + d.lower);
const midLim = d => r4(d.nominal + (d.upper + d.lower)/2);
const dName = d => d.tClass ? d.name + " " + d.tClass : d.name;
const fmtTol = v => v > 0 ? "+" + v : v === 0 ? "0" : "" + v;
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function judge(v, nom, up, lo){
  if (v === null || v === undefined || v === "") return null;
  const n = parseFloat(v); if (isNaN(n)) return null;
  const d = r4(n - nom);
  return (d >= r4(lo) && d <= r4(up)) ? "OK" : "NG";
}
function judgeDim(dim, v){ return judge(v, dim.nominal, dim.upper, dim.lower); }
function devOf(dim, v){ if (v === "" || v == null) return null; const n = parseFloat(v); if (isNaN(n)) return null; return r4(n - midLim(dim)); }
function fmtDev(dv){ return dv == null ? "" : (dv > 0 ? "+" + dv : "" + dv); }

function latestOf(meas, id){
  const a = (meas && meas[id]) || [];
  for (let i = a.length - 1; i >= 0; i--) if (a[i] !== "" && a[i] != null) return a[i];
  return "";
}
function filledCount(meas, id){
  const a = (meas && meas[id]) || [];
  return a.filter(x => x !== "" && x != null).length;
}
function statsOf(dims, meas){
  return (dims||[]).reduce((acc,d)=>{
    const j = judge(latestOf(meas, d.id), d.nominal, d.upper, d.lower);
    if (j === "OK") acc.ok++; else if (j === "NG") acc.ng++; else acc.none++;
    return acc;
  }, {ok:0, ng:0, none:0});
}
// all recorded values judged (not just the latest)
function allStats(dims, meas){
  let ok=0, ng=0;
  (dims||[]).forEach(d=>{ ((meas&&meas[d.id])||[]).forEach(v=>{ const j=judge(v,d.nominal,d.upper,d.lower); if(j==="OK")ok++; else if(j==="NG")ng++; }); });
  return {ok, ng};
}

// geometry for the deviation bar, in %
function barGeom(dim, v){
  const range = dim.upper - dim.lower;
  if (range === 0) return null;
  const mg = range * 0.6, dL = dim.lower - mg, dU = dim.upper + mg, dR = dU - dL;
  const g = { tL: ((dim.lower - dL)/dR)*100, tW: (range/dR)*100, pos: null, ok: false };
  if (v === "" || v == null) return g;
  const n = parseFloat(v); if (isNaN(n)) return g;
  const dev = n - dim.nominal;
  g.pos = Math.max(0, Math.min(100, ((dev - dL)/dR)*100));
  g.ok = dev >= dim.lower && dev <= dim.upper;
  return g;
}

function emptyRounds(n){ return Array(n).fill(""); }
function normalizeProject(p){
  if (!p.dims) p.dims = [];
  if (!p.meas) p.meas = {};
  if (!p.rounds) p.rounds = DEFAULT_ROUNDS;
  // records predating the selectable round count keep the base model's 5 columns,
  // unless the operator picked a count (roundsSet) or values exist beyond round 5
  if (!p.roundsSet && p.rounds > DEFAULT_ROUNDS){
    let used = 0;
    p.dims.forEach(d => {
      const a = p.meas[d.id] || [];
      for (let i = a.length - 1; i >= 0; i--) if (a[i] !== "" && a[i] != null){ used = Math.max(used, i + 1); break; }
    });
    if (used <= DEFAULT_ROUNDS) p.rounds = DEFAULT_ROUNDS;
  }
  p.rounds = Math.min(MAX_ROUNDS, Math.max(1, p.rounds));
  p.dims.forEach(d=>{
    if (!d.type) d.type = "穴";
    if (d.inReport === undefined) d.inReport = true;
    if (!Array.isArray(p.meas[d.id])) p.meas[d.id] = emptyRounds(p.rounds);
    while (p.meas[d.id].length < p.rounds) p.meas[d.id].push("");
  });
  return p;
}
function newProject(opts){
  const dims = opts.preset ? JSON.parse(JSON.stringify(PRESET)) : [];
  const rounds = opts.rounds || DEFAULT_ROUNDS;
  const meas = {}; dims.forEach(d => meas[d.id] = emptyRounds(rounds));
  return normalizeProject({
    id: genId(), partName: opts.partName || "", drawingNo: opts.drawingNo || "",
    dims, meas, rounds, roundsSet: true, inspector: "", date: new Date().toISOString().split("T")[0],
    serial: "", createdAt: Date.now(), updatedAt: Date.now()
  });
}
function parseImport(raw){
  const data = JSON.parse(raw);
  if (!data.dims || !Array.isArray(data.dims) || !data.dims.length) throw new Error("寸法データ(dims)がありません");
  data.dims.forEach(d=>{ if (d.nominal == null || d.upper == null || d.lower == null) throw new Error("寸法データの形式が不正です (name, nominal, upper, lower が必要)"); });
  return data;
}
function dimFromJSON(d, id){

    method: d.method || "", toolNo: d.toolNo || "", jobNo: d.jobNo || ""
  };
}

/* ── tiny DOM helper (same shape as the original file's h()) ── */
function h(tag, attrs, children){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "style") e.style.cssText = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "text") e.textContent = v;
    else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "checked" || k === "disabled" || k === "readOnly") e[k] = !!v;
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v);
  }
  (children || []).forEach(c => { if (c == null || c === false) return; e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c))); });
  return e;
}

  if (!p) return;
  P = normalizeProject(p);
  TAB = "meas"; EDIT = false; SHOWMERGE = false;

    if (data && data.updatedAt > (P.updatedAt || 0) + 2000){ Object.assign(P, data); normalizeProject(P); renderProject(); }
  });

}

    P.dims.forEach(d => { const a = P.meas[d.id] || []; while (a.length < P.rounds) a.push(""); P.meas[d.id] = a; });

    h("label", { style:"display:flex;align-items:baseline;gap:5px" }, [ h("span", { style:"font-size:11px;color:#5F6368;font-weight:600", text:"回数" }), selR ]),

      onclick: () => { EDIT = !EDIT; renderProject(); } })

const PIN = [

function buildTable(){
  const wrap = h("div", { style:"flex:1;min-height:120px;background:#FFF;border:1px solid #DADCE0;border-radius:16px;overflow:auto;scroll-snap-type:y mandatory;scroll-padding-top:28px;scroll-padding-bottom:8px" });

    return wrap;
  }
  const table = h("table", { style:"border-collapse:separate;border-spacing:0;width:100%" });
  wrap.appendChild(table);

  // header
  const trh = h("tr");
  let left = 0;
  PIN.forEach((c, i) => {
    trh.appendChild(h("th", { "data-pin":"1", style:"position:sticky;left:" + left + "px;top:0;z-index:40;background:#FFF;border-bottom:2px solid #E8EAED;" + (i === PIN.length-1 ? "border-right:2px solid #E8EAED;" : "") + "padding:6px 4px;font-size:11px;font-weight:600;color:#5F6368;text-align:center;white-space:nowrap;width:" + c.w + "px;min-width:" + c.w + "px;max-width:" + c.w + "px", text:c.label }));
    left += c.w;
  });
  for (let i = 0; i < P.rounds; i++)
    trh.appendChild(h("th", { style:"position:sticky;top:0;z-index:30;background:#FFF;border-bottom:2px solid #E8EAED;padding:6px 4px;font-size:11px;font-weight:600;color:#5F6368;text-align:center;white-space:nowrap;min-width:81px", text:(i+1) + "回目" }));
  trh.appendChild(h("th", { "data-pin":"1", style:"position:sticky;top:0;right:44px;z-index:40;background:#FFF;border-bottom:2px solid #E8EAED;border-left:2px solid #E8EAED;padding:6px 4px;font-size:11px;font-weight:600;color:#5F6368;text-align:center;white-space:nowrap;width:112px;min-width:112px;max-width:112px", text:"状態" }));
  trh.appendChild(h("th", { "data-pin":"1", style:"position:sticky;top:0;right:0;z-index:40;background:#FFF;border-bottom:2px solid #E8EAED;padding:6px 4px;font-size:11px;font-weight:600;color:#5F6368;text-align:center;white-space:nowrap;width:44px;min-width:44px;max-width:44px", text:"判定" }));
  table.appendChild(h("thead", null, [trh]));

  table.appendChild(tbody);
  P.dims.forEach(dim => tbody.appendChild(buildRow(dim)));

  // rows must snap BELOW the sticky header, so the offset has to equal its measured height
  wrap.__fitHeader = () => {
    const th = table.querySelector("thead th");
    if (th && th.offsetHeight) wrap.style.scrollPaddingTop = Math.ceil(th.offsetHeight) + "px";
  };
  return wrap;

/* one row only — never a full re-render (this is what keeps typing fast) */
function patchRow(dim){
  const q = s => document.querySelector(s);
  const arr = P.meas[dim.id] || [];
  for (let i = 0; i < P.rounds; i++){
    const v = arr[i] || "", rj = judgeDim(dim, v), dv = devOf(dim, v);
    const dev = q('[data-dev="' + dim.id + "-" + i + '"]');
    if (dev){ dev.textContent = dv == null ? "" : "(" + fmtDev(dv) + ")"; dev.style.color = rj === "OK" ? "#0B7A45" : "#B3261E"; }
    const inp = q('[data-cell="' + dim.id + "-" + i + '"]');
    if (inp){
      inp.style.borderColor = rj === "NG" ? "#D93025" : rj === "OK" ? "#A8DCC0" : "#DADCE0";
      inp.style.background  = rj === "NG" ? "#FCE8E6" : "#FFF";
      inp.style.color       = rj === "NG" ? "#B3261E" : "#202124";
    }
  }
  const lv = latestOf(P.meas, dim.id), j = judgeDim(dim, lv);
  const jb = q('[data-judge="' + dim.id + '"]');
  if (jb){
    jb.textContent = j || "—";
    jb.style.background = j === "OK" ? "#E6F4EA" : j === "NG" ? "#FCE8E6" : "#F1F3F4";
    jb.style.color = j === "OK" ? "#0B7A45" : j === "NG" ? "#B3261E" : "#5F6368";
  }
  const g = barGeom(dim, lv), dot = q('[data-dot="' + dim.id + '"]');
  if (dot && g){
    dot.style.display = g.pos == null ? "none" : "block";
    if (g.pos != null){ dot.style.left = g.pos + "%"; dot.style.background = g.ok ? "#0F9D58" : "#D93025"; }
  }
  const tr = q('[data-row="' + dim.id + '"]');
  if (tr) [].forEach.call(tr.children, td => {
    td.style.background = td.hasAttribute("data-mid") ? (j === "NG" ? "#FFF7F6" : "#F7FAFF") : (j === "NG" ? "#FFF7F6" : "#FFF");
  });
  const st = statsOf(P.dims, P.meas);
  const setS = (k, v) => { const e = q('[data-sum="' + k + '"]'); if (e) e.textContent = String(v); };
  setS("total", P.dims.length); setS("ok", st.ok); setS("ng", st.ng); setS("none", st.none);
}

    const num = (col, val, color, ph, on) => h("input", { type:"number", step:"any", value:val, placeholder:ph || "", "data-ec": col + "-" + idx,
      style:"width:100%;height:34px;padding:0 5px;font-size:13px;font-weight:600;text-align:center;border:1px solid #DADCE0;border-radius:8px;color:" + color + ";" + MONO,
      onfocus: e => e.target.select(), onkeydown: navKey(col, idx), oninput: on });
    const txt = (col, val, on) => h("input", { type:"text", value:val, placeholder:"—", "data-ec": col + "-" + idx,
      style:"width:100%;height:34px;padding:0 5px;font-size:13px;font-weight:600;text-align:center;border:1px solid #DADCE0;border-radius:8px;" + MONO,
      onfocus: e => e.target.select(), onkeydown: navKey(col, idx), onchange: on });
    const sel = (opts, val, color, on) => { const s = h("select", { style:"width:100%;height:34px;padding:0 2px;font-size:13px;font-weight:600;border:1px solid #DADCE0;border-radius:8px;background:#FFF;color:" + color, onchange: on },
      opts.map(o => h("option", { value:o, text:o === "" ? "—" : o }))); s.value = val; return s; };

    const calc = h("div", { style:"text-align:center;font-size:12px;line-height:1.45;" + MONO }, [
      h("div", { style:"font-weight:700", text:String(uLim(d)) }), h("div", { style:"color:#5F6368", text:String(lLim(d)) })
    ]);
    const refresh = () => { calc.children[0].textContent = String(uLim(d)); calc.children[1].textContent = String(lLim(d)); };

    const upIn = num("up", d.upper, "#0B7A45", "", e => { const v = parseFloat(e.target.value); if (!isNaN(v)){ d.upper = v; save(); refresh(); } });
    const loIn = num("lo", d.lower, "#B3261E", "", e => { const v = parseFloat(e.target.value); if (!isNaN(v)){ d.lower = v; save(); refresh(); } });
    const syncFit = () => { upIn.value = d.upper; loIn.value = d.lower; refresh(); };

    const tr = h("tr", { style:"background:" + (idx % 2 ? "#FAFAFB" : "#FFF") }, [
      h("td", { style:"border-bottom:1px solid #E8EAED;padding:4px;text-align:center;font-size:13px;font-weight:600;color:#5F6368;" + MONO, text:String(idx+1) }),
      cell(sel(["穴","軸","距離"], d.type || "穴", TYPE_TEXT[d.type || "穴"], e => { d.type = e.target.value; d.name = (d.type === "距離" ? "" : "φ") + d.nominal; if (d.type === "距離") d.tClass = ""; applyFit(); save(); renderProject(); })),
      cell(num("nom", d.nominal, "#202124", "", e => { const v = parseFloat(e.target.value); if (isNaN(v)) return; d.nominal = v; d.name = (d.type === "距離" ? "" : "φ") + v; applyFit(); save(); syncFit(); })),
      cell(sel(d.type === "距離" ? [""] : (d.type === "軸" ? SHAFT_LETTERS : HOLE_LETTERS), curL, "#0062CC", e => { d.tClass = e.target.value + curG; applyFit(); save(); syncFit(); })),
      cell(sel(d.type === "距離" ? [""] : GRADES, curG, "#0062CC", e => { d.tClass = curL + e.target.value; applyFit(); save(); syncFit(); })),
      cell(num("qty", d.qty > 1 ? d.qty : "", "#202124", "1", e => { const v = parseInt(e.target.value,10); d.qty = (!isNaN(v) && v > 1) ? v : 1; save(); })),
      cell(upIn), cell(loIn), cell(calc),
      cell(sel(METHODS, d.method || "", "#202124", e => { d.method = e.target.value; save(); })),
      cell(txt("tool", (d.toolNo || "").replace(/^T/i, ""), e => { const v = e.target.value.trim().replace(/^T/i, ""); d.toolNo = v ? "T" + v : ""; save(); })),
      cell(txt("job", d.jobNo || "", e => { d.jobNo = e.target.value.trim(); save(); })),
      h("td", { style:"border-bottom:1px solid #E8EAED;padding:4px;text-align:center" }, [
        h("button", { style:"width:34px;height:34px;border:1px solid #DADCE0;border-radius:8px;background:#FFF;color:#5F6368;font-size:13px", text:"×",
          onclick: () => {
            if (!confirm((idx+1) + ". " + dName(d) + " を削除しますか")) return;
            P.dims = P.dims.filter(x => x.id !== d.id); delete P.meas[d.id];
            save(); renderProject();
          } })
      ])
    ]);
    tbody.appendChild(tr);
  });

  box.appendChild(scroll);
  box.appendChild(h("div", { style:"display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap" }, [
    h("button", { style:"height:42px;padding:0 18px;border:1px dashed #DADCE0;border-radius:12px;background:#FFF;color:#0062CC;font-size:13px;font-weight:600", text:"＋ 行を追加",
      onclick: () => {
        const nid = Math.max.apply(null, [0].concat(P.dims.map(d => d.id))) + 1;
        P.dims.push({ id:nid, name:"φ0", tClass:"", nominal:0, upper:0, lower:0, type:"穴", qty:1, inReport:true, method:"", toolNo:"", jobNo:"" });
        P.meas[nid] = emptyRounds(P.rounds);
        save(); renderProject();
      } }),
    h("div", { style:"font-size:12px;color:#5F6368", text:"記号と等級を選ぶと JIS B 0401 から上下偏差を自動入力。Enter で同じ列の次の行へ移動" })
  ]));
  return box;
}

/* ── report ── */
function renderReport(body){
  const dims = P.dims.filter(d => d.inReport !== false);
  let ok = 0, ng = 0, none = 0;
  const rows = dims.map((d, i) => {
    const lv = latestOf(P.meas, d.id), j = judgeDim(d, lv);
    if (j === "OK") ok++; else if (j === "NG") ng++; else none++;
    return h("tr", null, [
      h("td", { style:"border:1px solid #DADCE0;padding:8px 6px;text-align:center;color:#5F6368;" + MONO, text:String(i+1) }),
      h("td", { style:"border:1px solid #DADCE0;padding:8px 6px;text-align:center;font-size:13px;font-weight:600;color:" + (TYPE_TEXT[d.type] || "#5F6368"), text:d.type || "—" }),
      h("td", { style:"border:1px solid #DADCE0;padding:8px 10px;font-size:15px;font-weight:700", text:dName(d) + (d.qty > 1 ? " ×" + d.qty : "") }),
      h("td", { style:"border:1px solid #DADCE0;padding:8px 6px;text-align:center;white-space:nowrap;" + MONO, text:String(uLim(d)) }),
      h("td", { style:"border:1px solid #DADCE0;padding:8px 6px;text-align:center;white-space:nowrap;" + MONO, text:String(lLim(d)) }),
      h("td", { style:"border:1px solid #DADCE0;padding:8px 6px;text-align:center;font-size:15px;font-weight:700;" + MONO + ";color:" + (lv ? (j === "OK" ? "#0B7A45" : "#B3261E") : "#5F6368"), text:lv || "—" }),
      h("td", { style:"border:1px solid #DADCE0;padding:8px 6px;text-align:center;font-weight:700;color:" + (j === "OK" ? "#0B7A45" : j === "NG" ? "#B3261E" : "#5F6368"), text:j || "—" })
    ]);
  });
  const verdict = ng > 0 ? "不合格" : (none > 0 || !dims.length) ? "未完了" : "合格";

  const inner = h("div", { style:"max-width:900px;margin:0 auto" });
  body.appendChild(inner);
  inner.appendChild(h("div", { class:"no-print", style:"display:flex;justify-content:flex-end;margin-bottom:10px" }, [
    h("button", { style:"height:44px;padding:0 22px;border:none;border-radius:12px;background:#007AFF;color:#FFF;font-size:14px;font-weight:600", text:"印刷 / PDF保存", onclick: () => window.print() })
  ]));

  const sign = h("div", { style:"display:flex;flex-shrink:0;border:1px solid #202124" }, ["承認","確認","作成"].map(s =>
    h("div", { style:"width:70px;border-left:1px solid #202124" }, [
      h("div", { style:"font-size:11px;text-align:center;padding:3px 0;border-bottom:1px solid #202124;color:#5F6368;white-space:nowrap", text:s }),
      h("div", { style:"height:44px" })
    ])));

  const metaRow = (l1,v1,l2,v2) => h("tr", null, [
    h("th", { style:"width:74px;text-align:left;padding:5px 8px 5px 0;color:#5F6368;font-weight:600;white-space:nowrap", text:l1 }),
    h("td", { style:"padding:5px 22px 5px 0;font-weight:600;white-space:nowrap", text:v1 }),
    h("th", { style:"width:74px;text-align:left;padding:5px 8px 5px 0;color:#5F6368;font-weight:600;white-space:nowrap", text:l2 }),
    h("td", { style:"padding:5px 0;font-weight:600;white-space:nowrap", text:v2 })
  ]);

  inner.appendChild(h("div", { class:"print-area", style:"background:#FFF;border:1px solid #DADCE0;border-radius:16px;padding:28px 32px" }, [
    h("div", { style:"display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid #202124;padding-bottom:12px;margin-bottom:16px" }, [
      h("div", { style:"flex-shrink:0" }, [
        h("div", { style:"font-size:24px;font-weight:700;letter-spacing:.12em;white-space:nowrap", text:"検査成績書" }),
        h("div", { style:"font-size:12px;color:#5F6368;margin-top:3px;white-space:nowrap", text:"寸法検査ツール " + VER })
      ]), sign
    ]),
    h("table", { style:"width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px" }, [
      h("tbody", null, [
        metaRow("図番", P.drawingNo || "—", "品名", P.partName || "—"),
        metaRow("検査日", P.date || "—", "担当", P.inspector || "—"),
        metaRow("S/N", P.serial || "—", "測定回数", P.rounds + "回 (最新値を記載)")
      ])
    ]),
    h("table", { style:"width:100%;border-collapse:collapse;font-size:13px" }, [
      h("thead", null, [ h("tr", { style:"background:#F1F3F4" }, [
        ["No.",42],["種別",50],["寸法",0],["上限値",86],["下限値",86],["実測値",92],["判定",56]
      ].map(c => h("th", { style:"border:1px solid #DADCE0;padding:8px 6px;font-size:12px;color:#5F6368;" + (c[1] ? "width:" + c[1] + "px" : "text-align:left"), text:c[0] }))) ]),
      h("tbody", null, rows)
    ]),
    h("div", { style:"display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px;padding-top:10px;border-top:1px solid #DADCE0;font-size:13px;color:#5F6368" }, [
      h("div", { style:"white-space:nowrap", text:"全" + dims.length + "項目 · OK " + ok + " · NG " + ng + " · 未測定 " + none }),
      h("div", { style:"font-size:17px;font-weight:700;white-space:nowrap;color:" + (ng > 0 ? "#B3261E" : none > 0 ? "#5F6368" : "#0B7A45"), text:"総合判定 " + verdict })
    ])
  ]));
}

initFB();
renderList();

</script>
</body>
</html>
